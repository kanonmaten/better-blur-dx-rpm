name: upstream version bump

# Checks upstream's latest GitHub release and, if it is newer, opens a PR
# that bumps packaging/ and turns on auto-merge. OBS test-builds the PR; when
# the "OBS: kwin-effects-better-blur-dx ..." check goes green the PR merges
# itself, and the push to main triggers the real rebuild.
#
# KWin updates don't come through here: OBS rebuilds the package by itself
# when kwin6-devel changes in Tumbleweed.
#
# Auto-merge is inert until, in repo Settings: (a) "Allow auto-merge" is on,
# and (b) a branch ruleset on main requires the status check
# "OBS: kwin-effects-better-blur-dx - openSUSE_Tumbleweed/x86_64".
# scripts/obs-bootstrap.sh sets both.

on:
  schedule:
    - cron: "43 */6 * * *"    # every 6 hours, at :43
  workflow_dispatch:
    inputs:
      version:
        description: "Pin a specific version (default: upstream's latest release)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run bump script
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(scripts/bump-version.sh ${{ inputs.version }})
          echo "$out"
          if echo "$out" | grep -q '^bumped '; then
            new=$(echo "$out" | sed -n 's/^bumped .* -> //p')
            echo "changed=true"     >> "$GITHUB_OUTPUT"
            echo "version=$new"     >> "$GITHUB_OUTPUT"
          else
            echo "changed=false"    >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: cpr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bump/kwin-effects-better-blur-dx-${{ steps.bump.outputs.version }}
          commit-message: "kwin-effects-better-blur-dx ${{ steps.bump.outputs.version }}: update to upstream release"
          author: "kanonmaten <86723077+kanonmaten@users.noreply.github.com>"
          title: "kwin-effects-better-blur-dx ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump to upstream's latest release:
            https://github.com/xarblu/kwin-effects-better-blur-dx/releases/tag/v${{ steps.bump.outputs.version }}

            - `Version` and `%global src_sha256` updated in `packaging/kwin-effects-better-blur-dx.spec`
            - `download_url` URL updated in `packaging/_service`
            - SHA256 is verified in `%prep` at build time

            OBS test-builds this in a scratch project; merges on green.
          labels: automated, upstream-bump

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: |
          gh pr merge --auto --squash "$PR" \
            || echo "::warning::could not enable auto-merge - is 'Allow auto-merge' on and a required check set? merge PR #$PR by hand."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
